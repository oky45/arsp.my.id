<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Layanan Kearsipan Dinarpus</title>
  
  <!-- Meta Deskripsi & Identitas SEO / Media Sosial -->
  <meta name="description" content="Portal Layanan Kearsipan Modern Dinas Kearsipan dan Perpustakaan Kabupaten Kudus. Akses pedoman tata naskah dinas, jadwal retensi arsip, dan konsultasi pembinaan kearsipan.">
  <meta name="author" content="Arsiparis Dinas Kearsipan dan Perpustakaan Kabupaten Kudus">
  <meta name="theme-color" content="#0a1120">
  
  <!-- Open Graph / WhatsApp / Facebook Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Portal Layanan Kearsipan Modern - arsp.my.id">
  <meta property="og:description" content="Pusat regulasi kearsipan, SOP, dan layanan konsultasi pembinaan kearsipan Kabupaten Kudus.">
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1h4U-M6eEIwpbE9sV6u7b1J94S1dlDFWw">
  
  <!-- Favicon Resmi Google Drive (Direct CDN Google) -->
  <link rel="icon" type="image/x-icon" href="https://lh3.googleusercontent.com/d/1h4U-M6eEIwpbE9sV6u7b1J94S1dlDFWw">
  <link rel="shortcut icon" href="https://lh3.googleusercontent.com/d/1h4U-M6eEIwpbE9sV6u7b1J94S1dlDFWw">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1h4U-M6eEIwpbE9sV6u7b1J94S1dlDFWw">

  <!-- Google Font Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a1120;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Pembungkus Fullscreen Tanpa Celah & Anti-Double Scroll */
    #app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      z-index: 10;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background-color: #0a1120;
    }

    /* Layar Loading Elegan Bertema Kearsipan Kudus */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #132238 0%, #0a1120 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s ease;
      color: #f8fafc;
      text-align: center;
      padding: 24px;
    }

    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .logo-pulse-box {
      position: relative;
      margin-bottom: 24px;
    }

    .logo-pulse-box img {
      width: 92px;
      height: 92px;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(249, 115, 22, 0.45));
      animation: pulseLogo 2s infinite ease-in-out;
    }

    @keyframes pulseLogo {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 16px rgba(249, 115, 22, 0.4));
      }
      50% {
        transform: scale(1.06);
        filter: drop-shadow(0 0 26px rgba(249, 115, 22, 0.75));
      }
    }

    .spinner-ring {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #f97316;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 18px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .app-subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      max-width: 320px;
      line-height: 1.5;
    }

    /* Fallback jika jaringan lambat */
    #fallback-box {
      display: none;
      margin-top: 20px;
      font-size: 0.8rem;
    }

    #fallback-box a {
      color: #f97316;
      text-decoration: underline;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- ==================== SPLASH LOADING SCREEN ==================== -->
  <div id="loading-screen">
    <div class="logo-pulse-box">
      <!-- Menampilkan Favicon / Logo Resmi dari Google Drive CDN -->
      <img src="https://lh3.googleusercontent.com/d/1h4U-M6eEIwpbE9sV6u7b1J94S1dlDFWw" 
           alt="Logo Dinas Kearsipan dan Perpustakaan Kudus"
           onerror="this.onerror=null; this.src='https://cloud.kuduskab.go.id/index.php/s/YX8tQf7TSpwJe7W/preview';">
    </div>

    <div class="spinner-ring"></div>

    <h1 class="app-title">Portal Layanan Kearsipan</h1>
    <p class="app-subtitle">Memuat sistem informasi kearsipan arsp.my.id...</p>

    <div id="fallback-box">
      Membutuhkan waktu lebih lama? <a id="direct-link" href="#" target="_blank" rel="noopener noreferrer">Buka portal langsung &rarr;</a>
    </div>
  </div>

  <!-- ==================== PEMBUNGKUS IFRAME GAS ==================== -->
  <main id="app-container">
    <iframe 
      id="gas-frame"
      src="https://script.google.com/macros/s/AKfycbzD78h-vT3AMfiFwiR0iz0c-W2GDWdjUfjTJn9MNEl52K3s6uA3phaZIwcO1tMRpdSw7w/exec"
      title="Layanan Kearsipan Dinarpus"
      allow="clipboard-read; clipboard-write; fullscreen; autoplay"
      loading="eager">
    </iframe>
  </main>

  <script>
    (function() {
      var gasUrl = "https://script.google.com/macros/s/AKfycbzD78h-vT3AMfiFwiR0iz0c-W2GDWdjUfjTJn9MNEl52K3s6uA3phaZIwcO1tMRpdSw7w/exec";
      var frame = document.getElementById('gas-frame');
      var loadingScreen = document.getElementById('loading-screen');
      var fallbackBox = document.getElementById('fallback-box');
      var directLink = document.getElementById('direct-link');

      if (directLink) {
        directLink.href = gasUrl;
      }

      var hasLoaded = false;

      function hideLoader() {
        if (!hasLoaded) {
          hasLoaded = true;
          if (loadingScreen) {
            loadingScreen.classList.add('fade-out');
            setTimeout(function() {
              if (loadingScreen && loadingScreen.parentNode) {
                loadingScreen.parentNode.removeChild(loadingScreen);
              }
            }, 600);
          }
        }
      }

      // Sembunyikan loading saat konten web app selesai termuat
      if (frame) {
        frame.addEventListener('load', function() {
          hideLoader();
        });
      }

      // Tampilkan tombol darurat jika jaringan melambat setelah 5 detik
      setTimeout(function() {
        if (!hasLoaded && fallbackBox) {
          fallbackBox.style.display = 'block';
        }
      }, 5000);

      // Batas aman maksimal 10 detik agar antarmuka tidak terhalang
      setTimeout(function() {
        hideLoader();
      }, 10000);
    })();
  </script>
</body>
</html>
